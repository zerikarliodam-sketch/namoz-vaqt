<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NETLIVY | Super App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; transition: 0.3s; }
        .glass { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.2); }
        .dark-mode { background: #0f172a; color: white; }
        .light-mode { background: #f1f5f9; color: #1e293b; }
        .active-prayer { background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; transform: scale(1.02); }
        .tab-content { display: none; }
        .tab-active { display: block; }
    </style>
</head>
<body class="dark-mode min-h-screen pb-20">

    <nav class="p-4 flex justify-between items-center glass sticky top-0 z-50">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center italic font-bold">N</div>
            <span class="font-bold tracking-tighter">NETLIVY</span>
        </div>
        <div class="flex gap-4">
            <button onclick="toggleTheme()"><i class="fas fa-moon text-xl"></i></button>
            <i class="fas fa-bell text-xl text-blue-400"></i>
        </div>
    </nav>

    <main class="max-w-md mx-auto p-4 space-y-6">
        
        <div class="flex justify-between items-end">
            <div>
                <h2 class="text-3xl font-bold">Toshkent</h2>
                <p class="text-gray-400 text-sm">6-Yanvar, 2026 | 17-Rajab</p>
            </div>
            <select class="bg-transparent border-b border-blue-500 text-sm outline-none">
                <option>Toshkent</option>
                <option>Samarqand</option>
                <option>Andijon</option>
            </select>
        </div>

        <div id="home" class="tab-content tab-active space-y-6">
            <div class="glass p-8 rounded-[2rem] text-center relative overflow-hidden">
                <div class="absolute top-0 left-0 w-full h-1 bg-blue-500/30">
                    <div class="h-full bg-blue-500 w-2/3"></div>
                </div>
                <p class="text-xs uppercase tracking-widest text-blue-400 mb-2">Keyingi namoz: Peshin</p>
                <h1 class="text-6xl font-black mb-2">-01:45:22</h1>
                <p class="text-sm opacity-70">Bomdod o'qildi • 06:15</p>
            </div>

            <div class="space-y-3">
                <div class="glass p-4 rounded-2xl flex justify-between items-center opacity-60">
                    <div class="flex items-center gap-4"><i class="fas fa-cloud-sun"></i><span>Bomdod</span></div>
                    <span class="font-bold">06:12</span>
                </div>
                <div class="active-prayer p-5 rounded-2xl flex justify-between items-center shadow-lg shadow-blue-500/20">
                    <div class="flex items-center gap-4"><i class="fas fa-sun"></i><span class="font-bold">Peshin</span></div>
                    <span class="font-bold">12:35</span>
                </div>
                <div class="glass p-4 rounded-2xl flex justify-between items-center">
                    <div class="flex items-center gap-4"><i class="fas fa-leaf"></i><span>Asr</span></div>
                    <span class="font-bold">15:44</span>
                </div>
                <div class="glass p-4 rounded-2xl flex justify-between items-center">
                    <div class="flex items-center gap-4"><i class="fas fa-moon"></i><span>Shom</span></div>
                    <span class="font-bold">17:22</span>
                </div>
            </div>
        </div>

        <div id="tasbeh" class="tab-content space-y-6 text-center">
            <h2 class="text-2xl font-bold">Raqamli Tasbeh</h2>
            <div class="w-64 h-64 border-8 border-blue-500 rounded-full mx-auto flex flex-col items-center justify-center glass shadow-2xl">
                <span id="counter" class="text-6xl font-black">0</span>
                <span class="text-blue-400 uppercase text-xs mt-2">Subhanalloh</span>
            </div>
            <div class="flex justify-center gap-4">
                <button onclick="countUp()" class="w-20 h-20 bg-blue-600 rounded-full text-3xl"><i class="fas fa-fingerprint"></i></button>
                <button onclick="resetCount()" class="w-12 h-12 bg-red-500/20 text-red-500 rounded-full mt-4"><i class="fas fa-undo"></i></button>
            </div>
        </div>

        <div id="qibla" class="tab-content text-center py-10">
            <div class="relative w-48 h-48 mx-auto border-4 border-dashed border-blue-500 rounded-full flex items-center justify-center">
                <i class="fas fa-compass text-8xl text-blue-500"></i>
                <div class="absolute -top-4 text-red-500 font-bold">KA'BA</div>
            </div>
            <p class="mt-8 text-gray-400">Telefoningizni tekis tuting</p>
        </div>

    </main>

    <nav class="fixed bottom-0 left-0 right-0 glass p-4 rounded-t-[2rem] flex justify-around items-center border-t border-white/10">
        <button onclick="showTab('home')" class="text-blue-500 flex flex-col items-center"><i class="fas fa-home"></i><span class="text-[10px]">Asosiy</span></button>
        <button onclick="showTab('tasbeh')" class="text-gray-400 flex flex-col items-center"><i class="fas fa-beads"></i><span class="text-[10px]">Tasbeh</span></button>
        <button onclick="showTab('qibla')" class="text-gray-400 flex flex-col items-center"><i class="fas fa-kaaba"></i><span class="text-[10px]">Qibla</span></button>
        <button class="text-gray-400 flex flex-col items-center"><i class="fas fa-book-quran"></i><span class="text-[10px]">Qur'on</span></button>
    </nav>

    <script>
        // Theme Toggle
        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            document.body.classList.toggle('light-mode');
        }

        // Tab System
        function showTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('tab-active'));
            document.getElementById(tabId).classList.add('tab-active');
            
            // Update icons color
            document.querySelectorAll('nav button').forEach(btn => btn.classList.replace('text-blue-500', 'text-gray-400'));
            event.currentTarget.classList.replace('text-gray-400', 'text-blue-500');
        }

        // Tasbeh Logic
        let count = 0;
        function countUp() {
            count++;
            document.getElementById('counter').innerText = count;
            if (window.navigator.vibrate) window.navigator.vibrate(50);
        }
        function resetCount() {
            count = 0;
            document.getElementById('counter').innerText = count;
        }
    </script>
</body>
</html>
